name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    name: Core and Android build (no physical device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: ./gradlew :core:test :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --console=plain
      - run: python3 -m py_compile tools/*.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: host-android-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm audit --omit=dev --audit-level=high
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Public tree hygiene
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','ls-files'],text=True).splitlines()
          denied = [p for p in paths if p.endswith(('.db','.apk','.jks','.keystore','.token','.secret')) or p.startswith(('pairing/','device-captures/','diagnostics/','gateway/.dev.vars'))]
          assert not denied, denied
          PY
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
