name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android:
    name: Core and Android build (no physical device)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: ./gradlew :core:test :app:assembleDebug :app:testDebugUnitTest :adb-bootstrap:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleRelease --console=plain
      - name: Verify release debug isolation
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          sdk = os.environ['ANDROID_HOME']
          manifest = subprocess.check_output([f'{sdk}/build-tools/37.0.0/aapt2', 'dump', 'xmltree', '--file', 'AndroidManifest.xml', 'app/build/outputs/apk/release/app-release-unsigned.apk'], text=True)
          assert 'SemanticUiFixtureActivity' not in manifest, 'Debug fixture leaked into release manifest'
          assert 'BIND_ACCESSIBILITY_SERVICE' in manifest
          removed = Path('app/build/outputs/mapping/release/usage.txt').read_text().splitlines()
          assert 'dev.siconnect.app.transport.LocalEndpoint' in removed, 'Debug loopback endpoint was not removed by R8'
          PY
      - run: python3 -m py_compile $(git ls-files 'tools/*.py' 'tools/**/*.py')
      - name: Lint the Termux launcher shipped inside the APK
        run: shellcheck tools/termux/*.sh
      - run: python3 -m unittest discover -s tools/tests -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-android-reports
          path: |
            core/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
            adb-bootstrap/build/reports/tests/
            build/reports/dependency-verification/
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm audit --audit-level=high
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Public tree hygiene
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','ls-files'],text=True).splitlines()
          denied = [p for p in paths if p.endswith(('.db','.apk','.jks','.keystore','.token','.secret','.p12','.pem','.key')) or p.split('/')[-1] in ('signing.properties','local.properties','.dev.vars') or p.startswith(('pairing/','device-captures/','diagnostics/','gateway/.dev.vars'))]
          assert not denied, denied
          PY
      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
